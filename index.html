<html lang="fr" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>
:root{--bg:#070B14;--card:#0E1626;--line:#1C2A44;--blue:#1E6BFF;--blue2:#4DA3FF;--txt:#fff;--mut:#9DACC6;--wa:#25D366}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(1200px 500px at 50% -200px,#14306e66,transparent),var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic",Tahoma,sans-serif;padding-bottom:env(safe-area-inset-bottom,0px)}
a{color:inherit;text-decoration:none}
header{position:sticky;top:0;z-index:9;background:rgba(7,11,20,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.logo{font-weight:800;font-size:18px;background:linear-gradient(90deg,var(--blue2),#fff);-webkit-background-clip:text;background-clip:text;color:transparent;margin-inline-end:auto}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav a{font-size:13px;padding:6px 10px;border-radius:99px;color:var(--mut);border:1px solid transparent}
nav a.on,nav a:hover{color:#fff;border-color:var(--blue);background:#1E6BFF22}
.lang{background:none;border:1px solid var(--blue);color:#fff;border-radius:8px;padding:5px 10px;font-weight:700;cursor:pointer}
main{max-width:1100px;margin:auto;padding:20px 16px 60px}
h1{font-size:26px;margin:8px 0}h2{font-size:20px;margin:18px 0 10px}
.hero{padding:34px 18px;border-radius:20px;background:linear-gradient(135deg,#1E6BFF,#0A2A6B);box-shadow:0 20px 60px #1E6BFF33}
.hero p{color:#E6EEFF;margin:6px 0 16px}
.btn{display:inline-block;background:#fff;color:#0A2A6B;font-weight:700;border:0;padding:12px 18px;border-radius:12px;cursor:pointer;font-size:15px;text-align:center}
.btn.b{background:var(--blue);color:#fff}
.btn.wa{background:var(--wa);color:#04210f}
.btn.g{background:none;border:1px solid var(--line);color:var(--txt)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:760px){.grid{grid-template-columns:repeat(4,1fr)}}
.pl{grid-template-columns:1fr}
@media(min-width:760px){.pl{grid-template-columns:1fr 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:block;transition:.2s}
.card:hover{border-color:var(--blue)}
.img{aspect-ratio:1;background:linear-gradient(145deg,#15306b,#070B14);display:flex;align-items:center;justify-content:center;font-size:44px}
.img img{width:100%;height:100%;object-fit:cover}
.bd{padding:10px 12px}
.pr{color:var(--blue2);font-weight:800;margin:4px 0}
small,.mut{color:var(--mut);font-size:13px}
.cat{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:22px 10px;text-align:center;font-weight:700}
.cat span{font-size:34px}
.box{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:14px}
.pdet{display:grid;gap:18px}
@media(min-width:760px){.pdet{grid-template-columns:1fr 1fr}}
.pdet .img{border-radius:16px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
input,select,textarea{width:100%;background:#0A1221;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;font-family:inherit}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.qty-control{display:flex;align-items:center;gap:10px;max-width:260px;margin-top:6px}
.qty-control input{width:100px;text-align:center;font-weight:800;font-size:18px;padding:10px}
.qty-btn{width:44px;height:44px;flex:0 0 44px;border:1px solid var(--blue);border-radius:12px;background:#1E6BFF22;color:#fff;font-size:25px;font-weight:800;cursor:pointer;touch-action:manipulation}
.qty-btn:active{background:var(--blue)}
.plan{text-align:center}.plan .p{font-size:36px;font-weight:900;color:var(--blue2)}
.del{background:none;border:1px solid #ff4d6d;color:#ff4d6d;border-radius:8px;padding:5px 9px;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:8px 4px;border-bottom:1px solid var(--line)}
</style>
</head>

function route(){const parts=(location.hash||"#/").slice(1).split("/");const r=parts[1]||"";const id=parts[2];const fn=V[r||"home"]||V.home;document.getElementById("app").innerHTML=fn(id);navRender();window.scrollTo(0,0)}
function navRender(){const items=[["#/",t("home")],["#/cats",t("cats")],["#/pricing",t("pricing")],["#/signup",t("signup")],["#/seller",L==="ar"?"فضاء التاجر":"Espace vendeur"],["#/admin",t("admin")]];const cur=location.hash||"#/";document.getElementById("nav").innerHTML=items.map(([h,l])=>`<a href="${h}" class="${cur===h?"on":""}">${l}</a>`).join("");document.getElementById("lg").textContent=L==="fr"?"عربي":"Français"}
function setLang(l){L=l;try{localStorage.setItem("ayd_lang",l)}catch(e){}document.documentElement.lang=l;document.documentElement.dir=l==="ar"?"rtl":"ltr";route()}
function upd(id){const qEl=document.getElementById("q");if(!qEl)return;const note=document.getElementById("orderNote");const p=byId(D.products,id);if(!p)return;const raw=qEl.value;if(raw===""){if(note)note.textContent=(L==="ar"?"المجموع: ":"Total : ")+"0.00 DH";return;}let q=parseInt(raw,10);if(!Number.isFinite(q)||q<1){if(note)note.textContent=(L==="ar"?"المجموع: ":"Total : ")+"0.00 DH";return;}if(q>1000){q=1000;qEl.value=q;}if(note)note.textContent=(L==="ar"?"المجموع: ":"Total : ")+(Number(p.p)*q).toFixed(2)+" DH"}
function changeQty(delta,id){const qEl=document.getElementById("q");if(!qEl)return;let q=parseInt(qEl.value,10);if(!Number.isFinite(q))q=1;q=Math.max(1,Math.min(1000,q+delta));qEl.value=q;upd(id)}
function normalizeQty(id){const qEl=document.getElementById("q");if(!qEl)return;let q=parseInt(qEl.value,10);if(!Number.isFinite(q)||q<1)q=1;if(q>1000)q=1000;qEl.value=q;upd(id)}
async function orderNow(productId){
  const p=byId(D.products,productId);if(!p)return;
  if(!SUPABASE_PUBLISHABLE_KEY||SUPABASE_PUBLISHABLE_KEY.includes("PASTE_")){alert(L==="ar"?"مفتاح Supabase غير مضبوط.":"La clé Supabase n'est pas configurée.");return;}
  const qEl=document.getElementById("q");let quantity=parseInt(qEl?.value||"1",10);
  if(!Number.isInteger(quantity)||quantity<1||quantity>1000){alert(L==="ar"?"أدخل كمية بين 1 و1000.":"Saisissez une quantité entre 1 et 1000.");return;}
  const customerName=prompt(L==="ar"?"شنو الاسم الكامل ديالك؟":"Votre nom complet ?");if(customerName===null)return;
  if(customerName.trim().length<2){alert(L==="ar"?"دخل الاسم الكامل.":"Veuillez saisir votre nom.");return;}
  const customerPhone=prompt(L==="ar"?"شنو رقم الهاتف ديالك؟":"Votre numéro de téléphone ?");if(customerPhone===null)return;
  if(customerPhone.replace(/[^0-9]/g,"").length<8){alert(L==="ar"?"دخل رقم هاتف صحيح.":"Veuillez saisir un numéro de téléphone valide.");return;}
  const btn=document.getElementById("ob");if(btn){btn.disabled=true;btn.textContent=L==="ar"?"جارٍ تسجيل الطلب…":"Enregistrement de la commande…";}
  try{
    const response=await fetch(`${SUPABASE_URL}/rest/v1/rpc/create_customer_order`,{method:"POST",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${SUPABASE_PUBLISHABLE_KEY}`,"Content-Type":"application/json"},body:JSON.stringify({p_product_id:productId,p_customer_name:customerName.trim(),p_customer_phone:customerPhone.trim(),p_quantity:quantity})});
    const body=await response.json().catch(()=>null);
    if(!response.ok)throw new Error(body?.message||body?.details||`HTTP ${response.status}`);
    const order=body||{};const unitPrice=Number(order.unit_price??p.p);const total=Number(order.total??(unitPrice*quantity));
    const sellerNumber=String(order.seller_whatsapp||WA).replace(/[^0-9]/g,"")||WA;
    const message=`Bonjour, je souhaite confirmer ma commande :\n• Produit : ${order.product_name||nm(p)}\n• Prix unitaire : ${unitPrice.toFixed(2)} DH\n• Quantité : ${quantity}\n• Total : ${total.toFixed(2)} DH\n• Nom : ${customerName.trim()}\n• Téléphone : ${customerPhone.trim()}\n• Référence : ${order.order_id||""}`;
    const waUrl=`https://wa.me/${sellerNumber}?text=${encodeURIComponent(message)}`;
    // Keep the shop page open and show a real user-clickable WhatsApp link.
    const note=document.getElementById("orderNote");
    if(note){
      note.textContent=L==="ar"?"تسجّل الطلب بنجاح. ضغط على الزر لتكمل فواتساب:":"Commande enregistrée. Appuyez sur le bouton pour continuer sur WhatsApp :";
      const link=document.createElement("a");
      link.href=waUrl;link.target="_blank";link.rel="noopener noreferrer";
      link.className="btn wa";link.style.display="inline-block";link.style.marginTop="10px";
      link.textContent=L==="ar"?"فتح واتساب وإرسال الطلب":"Ouvrir WhatsApp et envoyer la commande";
      note.appendChild(document.createElement("br"));note.appendChild(link);
    }
    alert(L==="ar"?"تسجّل الطلب بنجاح. غادي تلقى زر فتح واتساب تحت المجموع؛ ضغط عليه باش تكمل.":"Commande enregistrée. Le bouton WhatsApp apparaît sous le total ; appuyez dessus pour continuer.");
  }catch(err){console.error("Order submission failed:",err);alert((L==="ar"?"ما قدرناش نسجلو الطلب. ":"Impossible d'enregistrer la commande. ")+err.message);}
  finally{if(btn){btn.disabled=false;btn.textContent=t("order");}}
}
function sendReq(f){D.reqs.push({id:"r"+Date.now(),n:f.n.value,c:f.c.value,p:f.p.value,k:f.k.value,d:f.d.value});save();window.open(`https://wa.me/${WA}?text=${encodeURIComponent("Nouvelle demande : "+f.n.value+" – "+f.c.value+" – "+f.p.value)}`,"_blank");f.reset();alert(t("sent"))}

async function sellerFetch(path,options={}){
 if(!SELLER_SESSION)throw new Error("Session vendeur absente.");
 const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...options,headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${SELLER_SESSION.access_token}`,"Content-Type":"application/json",Prefer:"return=representation",...(options.headers||{})}});
 const data=await res.json().catch(()=>null);if(!res.ok)throw new Error(data?.message||data?.details||data?.hint||`HTTP ${res.status}`);return data;
}
async function loginSeller(f){
 const msg=document.getElementById("sellerMsg");if(msg)msg.textContent=L==="ar"?"جارٍ التحقق من الحساب…":"Vérification du compte…";
 const button=f.querySelector('button[type="submit"]');if(button)button.disabled=true;
 try{
  const res=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:"POST",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:f.email.value.trim(),password:f.password.value})});
  const data=await res.json().catch(()=>({}));if(!res.ok||!data.access_token)throw new Error(data.msg||data.message||data.error_description||"Connexion impossible");
  SELLER_SESSION=data;SELLER_EMAIL=data.user?.email||f.email.value.trim();
  const rows=await sellerFetch(`sellers?select=id,store_name,whatsapp,status,trial_ends_at,created_at&id=eq.${encodeURIComponent(data.user.id)}&limit=1`);
  if(!Array.isArray(rows)||!rows.length){SELLER_SESSION=null;SELLER_EMAIL="";throw new Error(L==="ar"?"هاد الحساب ما مربوطش بمتجر. تواصل مع الإدارة.":"Aucune boutique n’est associée à ce compte. Contactez l’administration.");}
  SELLER_PROFILE=rows[0];await loadSellerData();
 }catch(err){if(msg)msg.textContent=(L==="ar"?"تعذر الدخول: ":"Connexion refusée : ")+err.message;else alert(err.message);}
 finally{if(button)button.disabled=false;}
}
async function loadSellerData(){
 if(!SELLER_SESSION)return;const msg=document.getElementById("sellerMsg");if(msg)msg.textContent=L==="ar"?"جارٍ تحميل المتجر والمنتوجات…":"Chargement de la boutique et des produits…";
 try{
  const [profiles,products]=await Promise.all([
   sellerFetch(`sellers?select=id,store_name,whatsapp,status,trial_ends_at,created_at&id=eq.${encodeURIComponent(SELLER_SESSION.user.id)}&limit=1`),
   sellerFetch(`products?select=id,seller_id,name,description,category,price,image_url,is_active,created_at&seller_id=eq.${encodeURIComponent(SELLER_SESSION.user.id)}&order=created_at.desc&limit=200`)
  ]);
  if(!profiles.length)throw new Error("Profil vendeur introuvable.");SELLER_PROFILE=profiles[0];SELLER_PRODUCTS=Array.isArray(products)?products:[];SELLER_ERROR="";route();
 }catch(err){SELLER_ERROR=err.message;if(msg)msg.textContent=(L==="ar"?"تعذر تحميل البيانات: ":"Chargement impossible : ")+err.message;else route();}
}
async function sellerAddProduct(f){
 try{
  if(!SELLER_SESSION||!SELLER_PROFILE)throw new Error("Connectez-vous à votre boutique.");
  const price=Number(f.price.value);if(!Number.isFinite(price)||price<=0)throw new Error(L==="ar"?"دخل ثمن صحيح أكبر من صفر.":"Saisissez un prix supérieur à zéro.");
  const data={seller_id:SELLER_SESSION.user.id,name:f.name.value.trim(),description:f.description.value.trim()||null,category:f.category.value,price,image_url:f.image_url.value.trim()||null,is_active:true};
  await sellerFetch("products",{method:"POST",body:JSON.stringify(data)});f.reset();SELLER_ERROR=L==="ar"?"تزاد المنتوج بنجاح.":"Produit ajouté avec succès.";await loadSellerData();
 }catch(err){alert((L==="ar"?"تعذر إضافة المنتوج: ":"Ajout impossible : ")+err.message);}
}
function logoutSeller(){SELLER_SESSION=null;SELLER_EMAIL="";SELLER_PROFILE=null;SELLER_PRODUCTS=[];SELLER_ERROR="";location.hash="#/seller";route();}

async function loginAdmin(f){
  const msg=document.getElementById("adminMsg");if(msg)msg.textContent=L==="ar"?"جارٍ التحقق…":"Vérification…";
  const button=f.querySelector('button[type="submit"]');if(button)button.disabled=true;
  try{
    const res=await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`,{method:"POST",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,"Content-Type":"application/json"},body:JSON.stringify({email:f.email.value.trim(),password:f.password.value})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok||!data.access_token)throw new Error(data.msg||data.message||data.error_description||"Connexion impossible");
    ADMIN_SESSION=data;ADMIN_EMAIL=data.user?.email||f.email.value.trim();
    const check=await fetch(`${SUPABASE_URL}/rest/v1/rpc/is_admin`,{method:"POST",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${ADMIN_SESSION.access_token}`,"Content-Type":"application/json"},body:"{}"});
    if(!check.ok)throw new Error("Impossible de vérifier les droits administrateur.");
    const isAdmin=await check.json();if(isAdmin!==true){ADMIN_SESSION=null;throw new Error(L==="ar"?"هاد الحساب ما عندوش صلاحية المسؤول.":"Ce compte n'est pas autorisé comme administrateur.");}
    await loadAdminData();route();
  }catch(err){if(msg)msg.textContent=(L==="ar"?"تعذر الدخول: ":"Connexion refusée : ")+err.message;else alert(err.message);}
  finally{if(button)button.disabled=false;}
}
function logoutAdmin(){ADMIN_SESSION=null;ADMIN_EMAIL="";ADMIN_ORDERS=[];ADMIN_PRODUCTS={};ADMIN_PRODUCTS_ROWS=[];ADMIN_SELLERS=[];ADMIN_BRANDS=[];ADMIN_TAB="orders";route()}
function setAdminTab(tab){ADMIN_TAB=tab;route()}
async function adminFetch(path,options={}){
 if(!ADMIN_SESSION)throw new Error("Session administrateur absente.");
 const res=await fetch(`${SUPABASE_URL}/rest/v1/${path}`,{...options,headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${ADMIN_SESSION.access_token}`,"Content-Type":"application/json",Prefer:"return=representation",...(options.headers||{})}});
 const data=await res.json().catch(()=>null);if(!res.ok)throw new Error(data?.message||data?.details||data?.hint||`HTTP ${res.status}`);return data;
}
async function loadAdminData(){
 if(!ADMIN_SESSION)return;const msg=document.getElementById("adminMsg");if(msg)msg.textContent=L==="ar"?"جارٍ تحميل البيانات…":"Chargement des données…";
 const errors=[];
 const tasks=[
  ["orders",()=>adminFetch("orders?select=id,customer_name,customer_phone,product_id,quantity,unit_price,status,created_at&order=created_at.desc&limit=100")],
  ["products",()=>adminFetch("products?select=id,seller_id,brand_id,name,description,category,price,image_url,is_active,created_at&order=created_at.desc&limit=200")],
  ["sellers",()=>adminFetch("sellers?select=id,store_name,whatsapp,status,trial_ends_at,created_at&order=created_at.desc&limit=200")],
  ["brands",()=>adminFetch("brands?select=id,seller_id,name,discription,created_at&order=created_at.desc&limit=200")]
 ];
 const results=await Promise.all(tasks.map(async ([key,fn])=>{try{return [key,await fn(),null]}catch(e){return [key,null,e]}}));
 for(const [key,data,err] of results){if(err){errors.push(`${key}: ${err.message}`);continue;}if(key==="orders")ADMIN_ORDERS=Array.isArray(data)?data:[];if(key==="products"){ADMIN_PRODUCTS_ROWS=Array.isArray(data)?data:[];ADMIN_PRODUCTS=Object.fromEntries(ADMIN_PRODUCTS_ROWS.map(p=>[p.id,p.name]));}if(key==="sellers")ADMIN_SELLERS=Array.isArray(data)?data:[];if(key==="brands")ADMIN_BRANDS=Array.isArray(data)?data:[];}
 route();if(errors.length){const m=document.getElementById("adminMsg");if(m)m.textContent=(L==="ar"?"بعض الجداول ما تحمّلاتش، غالباً بسبب صلاحيات RLS: ":"Certaines tables n’ont pas pu être chargées (politiques RLS possibles) : ")+errors.join(" | ");}
}

 const data={seller_id:f.seller_id.value,name:f.name.value.trim(),description:f.description.value.trim()||null,price:Number(f.price.value),image_url:f.image_url.value.trim()||null,is_active:true,brand_id:f.brand_id.value||null};
 await adminFetch("products",{method:"POST",body:JSON.stringify(data)});alert(L==="ar"?"تزاد المنتج.":"Produit ajouté.");await loadAdminData();
 }catch(err){alert((L==="ar"?"فشل إضافة المنتج: ":"Ajout impossible : ")+err.message);}
}

async function loadAdminOrders(){
  if(!ADMIN_SESSION)return;
  const msg=document.getElementById("adminMsg");if(msg)msg.textContent=L==="ar"?"جارٍ تحميل الطلبات…":"Chargement des commandes…";
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/orders?select=id,customer_name,customer_phone,product_id,quantity,unit_price,status,created_at&order=created_at.desc&limit=100`,{headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${ADMIN_SESSION.access_token}`}});
    const data=await res.json().catch(()=>[]);if(!res.ok)throw new Error(data.message||`HTTP ${res.status}`);
    ADMIN_ORDERS=Array.isArray(data)?data:[];
    const pres=await fetch(`${SUPABASE_URL}/rest/v1/products?select=id,name&is_active=eq.true`,{headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${SUPABASE_PUBLISHABLE_KEY}`}});
    if(pres.ok){const products=await pres.json();ADMIN_PRODUCTS=Object.fromEntries(products.map(p=>[p.id,p.name]));}
    route();
  }catch(err){if(msg)msg.textContent=(L==="ar"?"تعذر تحميل الطلبات: ":"Erreur de chargement : ")+err.message;else alert(err.message);}
}
async function updateAdminStatus(status,orderId){
  if(!ADMIN_SESSION)return;
  const msg=document.getElementById("adminMsg");if(msg)msg.textContent=L==="ar"?"جارٍ تحديث الحالة…":"Mise à jour du statut…";
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/rpc/admin_update_order_status`,{method:"POST",headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${ADMIN_SESSION.access_token}`,"Content-Type":"application/json"},body:JSON.stringify({p_order_id:orderId,p_status:status})});
    const body=await res.json().catch(()=>null);if(!res.ok)throw new Error(body?.message||body?.details||`HTTP ${res.status}`);if(body!==true)throw new Error("Commande introuvable ou mise à jour non effectuée.");
    const order=ADMIN_ORDERS.find(o=>o.id===orderId);if(order)order.status=status;
    route();
  }catch(err){alert((L==="ar"?"فشل تحديث الحالة: ":"Échec de mise à jour : ")+err.message);await loadAdminOrders();}
}

async function addP(f){const fl=f.ph.files[0];const img=fl?await rd(fl):"";D.products.push({id:"p"+Date.now(),n:f.n.value,na:f.na.value,p:+f.p.value,c:f.c.value,s:f.s.value,d:f.d.value,img,ic:"🛍️"});save();alert(t("ok"));route()}
function addS(f){D.shops.push({id:"s"+Date.now(),n:f.n.value,city:f.c.value,phone:f.p.value.replace(/\D/g,""),d:f.d.value});save();alert(t("ok"));route()}
function addC(f){D.cats.push({id:"c"+Date.now(),fr:f.fr.value,ar:f.ar.value||f.fr.value,ic:f.ic.value||"📦"});save();alert(t("ok"));route()}

document.documentElement.lang=L;document.documentElement.dir=L==="ar"?"rtl":"ltr";
window.addEventListener("hashchange",route);
route();

// Charge les produits actifs depuis Supabase. Les commandes sont enregistrées via RPC puis ouvertes sur WhatsApp.
async function loadSupabaseProducts(){
  if(!SUPABASE_PUBLISHABLE_KEY || SUPABASE_PUBLISHABLE_KEY.includes("PASTE_")){
    console.warn("Ajoutez la clé Publishable Supabase dans SUPABASE_PUBLISHABLE_KEY."); return;
  }
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/products?select=id,seller_id,name,description,price,image_url,is_active,created_at&is_active=eq.true&order=created_at.desc`,{
      headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:`Bearer ${SUPABASE_PUBLISHABLE_KEY}`}
    });
    if(!res.ok) throw new Error(`Supabase HTTP ${res.status}: ${await res.text()}`);
    const rows=await res.json();
    const catId=(p)=>p.category||"aut";
    D.products=rows.map(p=>({id:p.id,seller_id:p.seller_id,n:p.name,na:p.name,p:Number(p.price),c:catId(p),s:"",d:p.description||"",img:p.image_url||"",ic:"🛍️"}));
    D.shops=[];
    route();
    console.info(`Supabase: ${rows.length} produit(s) actif(s) chargé(s).`);
  }catch(err){console.error("Échec du chargement des produits Supabase:",err);}
}
loadSupabaseProducts();
</script>
